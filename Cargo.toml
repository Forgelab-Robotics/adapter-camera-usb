[package]
name = "forge-devices-usb-camera"
version = "1.0.6"
edition = "2024"
rust-version = "1.97.1"
description = "Linux USB/UVC camera capture and Dora streaming node built with Rust and V4L2."
license = "Apache-2.0"
authors = ["X-ERA"]
readme = "README.md"
keywords = ["camera", "uvc", "v4l2", "dora", "robotics"]
categories = ["hardware-support", "multimedia::video", "command-line-utilities"]
repository = "https://github.com/Forgelab-Robotics/adapter-camera-usb"
homepage = "https://github.com/Forgelab-Robotics/adapter-camera-usb"
documentation = "https://github.com/Forgelab-Robotics/adapter-camera-usb#readme"

[[bin]]
name = "usb_camera"
path = "src/main.rs"

[[bin]]
name = "usb_camera_test_sink"
path = "src/bin/usb_camera_test_sink.rs"

[dependencies]
eyre = "0.6.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ndarray = "0.17.2"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
arrow-array = "54.3.1"
dora-node-api = "0.4.1"
forge_msgs = "1.0.1"
forge_common = { package = "forgelab_common", version = "1.0.1" }
crossbeam-channel = "0.5.15"
bytes = "1.6"
rand = "0.10.0"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14.0"
